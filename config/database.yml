default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432
  username: postgres
  password: <%= Rails.application.credentials.dig(:postgres, :password) %>

development:
  <<: *default
  database: renkley_development

test:
  <<: *default
  database: renkley_test

production:
  primary:
    <<: *default
    database: renkley_production

  cache:
    <<: *default
    database: renkley_production_cache
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: renkley_production_queue
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: renkley_production_cable
    migrations_paths: db/cable_migrate